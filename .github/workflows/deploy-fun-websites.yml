name: Deploy fun websites

on:
  push:
    branches: [main]
    paths:
      - "fun-websites/**"
      - ".github/workflows/deploy-fun-websites.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fun-websites/utshab-birthday
      - id: deployment
        uses: actions/deploy-pages@v4
